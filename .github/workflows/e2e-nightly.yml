name: E2E Nightly (Staging)

on:
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

concurrency:
  group: e2e-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-nightly:
    name: Playwright against staging
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CI: true
      E2E_BASE_URL: ${{ secrets.E2E_STAGING_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_STAGING_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_STAGING_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Require staging configuration
        run: |
          if [ -z "$E2E_BASE_URL" ] || [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::error::E2E staging secrets are not configured."
            exit 1
          fi

      - name: Run Playwright against staging
        run: npx playwright test --reporter=html,line

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
