name: E2E Nightly (Staging)

on:
  schedule:
    - cron: '0 3 * * 1-5' # Mon-Fri 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true

    env:
      CI: true
      E2E_BASE_URL: ${{ secrets.E2E_STAGING_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_STAGING_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_STAGING_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        uses: microsoft/playwright-github-action@v1
        with:
          browsers: chromium
          install-deps: true

      - name: Run Playwright against staging
        run: npx playwright test --reporter=html,line

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: |
            playwright-report/
            test-results/
          retention-days: 30
