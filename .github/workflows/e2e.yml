name: E2E Tests

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      supabase:
        image: public.ecr.aws/supabase/postgres:15.1.0.117
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true
      VITE_E2E: true
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-anon-key
      VITE_API_BASE_URL: http://127.0.0.1:8787
      E2E_USER_EMAIL: e2e-test@immigo.app
      E2E_USER_PASSWORD: E2ETest123!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        uses: microsoft/playwright-github-action@v1
        with:
          browsers: chromium
          install-deps: true

      - name: Start Supabase (local)
        run: |
          npm install -g @supabase/cli@1.127.4 || true
          supabase start --ignore-health-check || supabase start
          sleep 10
          supabase status

      - name: Migrate & seed database
        run: |
          supabase db reset --no-confirm || true
          supabase db push || true

      - name: Create E2E test user (best-effort)
        run: |
          node -e "
            console.log('E2E user setup placeholder');
          " || true

      - name: Build (optional)
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Run Playwright tests
        run: npx playwright test --reporter=html,line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
