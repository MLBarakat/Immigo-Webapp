version: 1
frontend:
  phases:
    preBuild:
      commands:
        - '# Set Node.js to version 18, as specified in README'
        - nvm use 18
        - '# Install frontend dependencies with Yarn'
        - yarn install --frozen-lockfile --network-concurrency 4
        - '# Install backend dependencies with Yarn'
        - cd server && yarn install && cd ..
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - server/node_modules/**/*