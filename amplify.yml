version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd Immigo-Webapp # Ensure you are in your frontend directory if amplify root is different
        - yarn install # Install frontend dependencies FIRST
        - cd ../server # Navigate to server directory
        - yarn install # Install backend dependencies
        - cd .. # Go back to the root if needed for subsequent steps
    build:
      commands:
        - cd Immigo-Webapp # Ensure you are in your frontend directory
        - yarn build # Build the frontend
  artifacts:
    baseDirectory: Immigo-Webapp/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - server/node_modules/**/*