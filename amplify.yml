version: 1
backend:
  phases:
    build:
      commands:
        # 1. Complete primary initialization
        - npm ci
        # 2. Fix 2: Re-populate modules inside functions that were stripped by the preinstall script to pass TypeScript compilation checks
        - cd amplify/functions && npm install && cd ../..
        # 3. Deploy full cloud orchestration stacks
        - npx ampx pipeline-deploy --app-id d3878p0w684f30 --branch dev
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf node_modules
        - npm cache clean --force
        - npm ci
    build:
      commands:
        - npm run test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  test:
    phases:
      preTest:
        commands:
          - npm ci
      test:
        commands:
          - npm run test:e2e
          - node scripts/run-benchmarks.js