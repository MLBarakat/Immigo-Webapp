version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --ignore-scripts
        - npm ci --prefix amplify/functions --ignore-scripts
        - npx ampx pipeline-deploy --app-id d3878p0w684f30 --branch dev
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf node_modules
        - npm cache clean --force
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*