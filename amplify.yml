version: 1
frontend:
  phases:
    preBuild:
      commands:
        - '# Set Node.js version'
        - nvm use node
        - npm cache clean --force
        - '# Install frontend dependencies'
        - npm i --prefer-offline --no-audit --no-fund
        - '# Install backend dependencies'
        - cd server
        - npm i --prefer-offline --no-audit --no-fund
        - cd ..
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - server/node_modules/**/*
      - '!node_modules/path/not/to/cache'