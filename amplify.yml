version: 1
frontend:
  phases:
    preBuild:
      commands:
        - '# Install frontend (root) dependencies'
        - npm install
        - '# Install backend (server) dependencies'
        - cd server && npm install && cd ..
    build:
      commands:
        - npm run build
  artifacts:
    # This correctly points to our Vite build output directory
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - server/node_modules/**/*