version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Node: $(node -v)  npm: $(npm -v)"
        - npm ci --omit=optional --prefer-offline --no-audit --no-fund
        - echo "Installing server deps"
        - cd server
        - npm ci --omit=optional --prefer-offline --no-audit --no-fund
        - cd ..
    build:
      commands:
        - echo "Building frontend"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - server/node_modules/**/*