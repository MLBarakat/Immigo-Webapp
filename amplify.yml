version: 1
backend:
  phases:
    build:
      commands:
        - '# Execute Amplify-provided script to detect and configure backend.'
        - amplifyPush --simple
frontend:
  phases:
    preBuild:
      commands:
        - '# Install frontend dependencies'
        - npm install
        - '# Install backend dependencies'
        - (cd server && npm install)
    build:
      commands:
        - '# Go back to the root directory before building'
        - cd ..
        - '# Build the Vite application'
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - server/node_modules/**/*