version: 1
frontend:
  phases:
    preBuild:
      commands:
        - '# Set Node.js version'
        - nvm use 18
        - npm ci
        - '# Clean install for backend dependencies'
        - cd server
        - npm ci
        - cd ..
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - server/node_modules/**/*
      - '!node_modules/path/not/to/cache'