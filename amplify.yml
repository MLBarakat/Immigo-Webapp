version: 1
frontend:
  phases:
    preBuild:
      commands:
        - '# Set Node.js version'
        - nvm use 18
        - '# Clean install for frontend dependencies'
        - rm -rf node_modules package-lock.json
        - npm ci
        - '# Clean install for backend dependencies'
        - cd server
        - rm -rf node_modules package-lock.json
        - npm ci
        - cd ..
    build:
      commands:
        - npm run build
  artifacts:
    # This correctly points to our Vite build output directory
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - server/node_modules/**/*