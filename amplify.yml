version: 1
backend:
  phases:
    build:
      commands:
        # Install top-level development tools safely
        - npm ci
        # Let ampx handle the modular building & bundling of all lambdas internally
        - npx ampx pipeline-deploy --app-id d3878p0w684f30 --branch dev
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf node_modules
        - npm cache clean --force
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*