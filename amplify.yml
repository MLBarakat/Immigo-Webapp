version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use node
        - yarn install --frozen-lockfile
        - cd server && yarn install && cd ..
        - mkdir -p dist/types
    build:
      commands:
        - yarn tsc --project tsconfig.build.json
        - (cd server && yarn tsc --project tsconfig.server.json || echo "No backend tsc step") # Specify backend tsconfig if exists
        - yarn build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - server/node_modules/**/*
      - .yarn/cache/**/*