version: 1
backend:
  phases:
    build:
      commands:
        - npx amplify pipeline-deploy
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf node_modules
        - yarn cache clean
        - yarn install --frozen-lockfile
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*