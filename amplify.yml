version: 1
backend:
  phases:
    build:
      commands:
        - yarn install --frozen-lockfile
        - npm ci --prefix amplify/functions --ignore-scripts
        - npx ampx pipeline-deploy --app-id d3878p0w684f30 --branch dev
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf node_modules
        - yarn cache clean
        - yarn install --frozen-lockfile
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*