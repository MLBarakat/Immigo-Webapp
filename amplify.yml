version: 1
backend:
  phases:
    build:
      commands:
        - cd amplify/functions && npm install && cd ../..
        - npx ampx pipeline-deploy --app-id d3p6hj0cz65790 --branch dev
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf node_modules
        - yarn cache clean
        - yarn install --frozen-lockfile
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*